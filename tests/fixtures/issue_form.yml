name: Nytt projekt-repo
description: "Skapar ett nytt repository och bjuder in contributors (triggar GitHub Action)."
title: "[Nytt repo]: "
labels: ["create-repo", automation]
assignees:
  - oscar-admin
body:
  - type: markdown
    attributes:
      value: |
        Fyll i formuläret. En GitHub Action skapar repot automatiskt.

        **Obs:** använd GitHub-användarnamn.
  - type: input
    id: repo_name
    attributes:
      label: Repository-namn
      description: Namnet på det nya repot (små bokstäver och bindestreck).
      placeholder: mitt-projekt
    validations:
      required: true
  - type: textarea
    id: contributors
    attributes:
      label: Contributors
      description: GitHub-användarnamn, ett per rad.
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: Synlighet
      options:
        - private
        - public
      default: 0
  - type: textarea
    id: notes
    attributes:
      label: Övrigt
      value: "Inget"
  - type: checkboxes
    id: terms
    attributes:
      label: Bekräftelse
      options:
        - label: Jag har kontrollerat användarnamnen
          required: true
        - label: Skicka välkomstmail # kommentar
